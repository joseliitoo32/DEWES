<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1</title>

</head>

<body onload="ej1()">

<script>
    var num1 = prompt("Dime un número");
    var num2 = prompt("Dime otro número");



    // Crear funcion para coger los datos de la variable y escribirla atraves de la funcion
    function ej1() {
        if (num1 > num2) {
            alert("El número mayor es el primero");
        }
        else if (num2 > num1) {
            alert("El número mayor es el segundo");
        }
        else {
            alert("Los dos números son iguales");
        }
    }
</script>

</body>

</html>
