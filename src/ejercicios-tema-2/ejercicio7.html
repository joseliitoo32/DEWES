<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 7</title>
</head>

<body onload="ej7()">

<script>
    var num = Number(prompt("Dime un número"));

    function ej7() {

        var factorial = 1;

        if (num < 0) {
            alert("No existe el factorial de números negativos");
        }
        else {
            for (var i = 1; i <= num; i++) {
                factorial = factorial * i;
            }

            alert("El factorial de " + num + " es " + factorial);
        }
    }
</script>

</body>

</html>
